
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokedex</title>

    <!-- Conectamos el archivo CSS -->
    <link rel="stylesheet" href="pokedex.css">

    <!-- Conectamos el archivo JavaScript -->
    <script src="pokedex.js" defer></script>
</head>

<body>
    <h1>Pokedex</h1>

    <!-- Input para escribir el nombre del Pokémon -->
    <input
        type="text"
        id="pokemonName"
        placeholder="Ingrese el nombre del Pokémon"
    >

    <!-- Botón para iniciar la búsqueda -->
    <button id="searchButton">Buscar Pokémon</button>

    <!-- Aquí mostraremos el resultado -->
    <div id="pokemonResult"></div>
</body>
</html>
